<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="State loop: devices feed integrations, which update the state machine; automations read states and call services back on devices.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6f7e"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0277bd"/>
    </marker>
  </defs>

  <!-- devices -->
  <rect x="24" y="150" width="200" height="120" rx="12" fill="#e9f1f6" stroke="#c9dae4"/>
  <text x="124" y="185" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#10202b">Devices</text>
  <text x="124" y="211" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15" fill="#5a6f7e">lights · locks · sensors</text>
  <text x="124" y="233" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15" fill="#5a6f7e">cameras · calendars</text>
  <text x="124" y="255" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15" fill="#5a6f7e">phones · weather</text>

  <!-- integrations -->
  <rect x="288" y="150" width="200" height="120" rx="12" fill="#e9f1f6" stroke="#c9dae4"/>
  <text x="388" y="185" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#10202b">Integrations</text>
  <text x="388" y="211" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15" fill="#5a6f7e">Zigbee · Z-Wave · Matter</text>
  <text x="388" y="233" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15" fill="#5a6f7e">MQTT · BLE · Wi-Fi</text>
  <text x="388" y="255" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15" fill="#5a6f7e">vendor clouds</text>

  <!-- state machine -->
  <rect x="552" y="128" width="220" height="164" rx="14" fill="#0d1a23" stroke="#03a9f4" stroke-width="2"/>
  <text x="662" y="168" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#ffffff">State machine</text>
  <text x="662" y="196" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="14" fill="#8fd3f2">light.kitchen = on</text>
  <text x="662" y="219" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="14" fill="#8fd3f2">person.jonah = home</text>
  <text x="662" y="242" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="14" fill="#8fd3f2">sun.sun = below_horizon</text>
  <text x="662" y="270" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="13" fill="#7f9bb0">one in-memory truth</text>

  <!-- automations -->
  <rect x="832" y="150" width="112" height="120" rx="12" fill="#e6f4fb" stroke="#9fd3ee"/>
  <text x="888" y="196" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0277bd">Automations</text>
  <text x="888" y="222" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="12" fill="#5a6f7e">trigger</text>
  <text x="888" y="240" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="12" fill="#5a6f7e">condition</text>
  <text x="888" y="258" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="12" fill="#5a6f7e">action</text>

  <!-- forward arrows -->
  <line x1="228" y1="210" x2="280" y2="210" stroke="#5a6f7e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="492" y1="210" x2="544" y2="210" stroke="#5a6f7e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="776" y1="210" x2="828" y2="210" stroke="#5a6f7e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- service return path -->
  <path d="M 886 276 L 886 350 L 124 350 L 124 278" fill="none" stroke="#0277bd" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-accent)"/>
  <rect x="356" y="332" width="300" height="36" rx="18" fill="#f6f9fb"/>
  <text x="506" y="356" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#0277bd">services: light.turn_on · lock.unlock</text>

  <!-- labels -->
  <text x="124" y="120" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="13" fill="#5a6f7e" letter-spacing="1.2">OBSERVE</text>
  <text x="886" y="120" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="13" fill="#0277bd" letter-spacing="1.2">ACT</text>
</svg>
