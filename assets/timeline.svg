<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="Home Assistant timeline: 2013 first release, 2017 Apache 2.0, 2018 Nabu Casa founded, 2024 Open Home Foundation, 2026 1500 integrations and 2.7 million households.">
  <g font-family="Avenir Next, Segoe UI, sans-serif">
    <!-- spine -->
    <line x1="36" y1="132" x2="924" y2="132" stroke="#c9dae4" stroke-width="2"/>

    <!-- 2013 -->
    <circle cx="96" cy="132" r="8" fill="#03a9f4"/>
    <text x="96" y="106" text-anchor="middle" font-size="26" font-weight="700" fill="#0277bd">2013</text>
    <text x="96" y="176" text-anchor="middle" font-size="14" fill="#10202b" font-weight="600">Home Assistant 0.1</text>
    <text x="96" y="196" text-anchor="middle" font-size="13.5" fill="#5a6f7e">released by Paulus</text>
    <text x="96" y="214" text-anchor="middle" font-size="13.5" fill="#5a6f7e">Schoutsen</text>

    <!-- 2017 -->
    <circle cx="288" cy="132" r="8" fill="#03a9f4"/>
    <text x="288" y="106" text-anchor="middle" font-size="26" font-weight="700" fill="#0277bd">2017</text>
    <text x="288" y="176" text-anchor="middle" font-size="14" fill="#10202b" font-weight="600">Apache 2.0</text>
    <text x="288" y="196" text-anchor="middle" font-size="13.5" fill="#5a6f7e">relicensed with</text>
    <text x="288" y="214" text-anchor="middle" font-size="13.5" fill="#5a6f7e">release 0.37</text>

    <!-- 2018 -->
    <circle cx="480" cy="132" r="8" fill="#03a9f4"/>
    <text x="480" y="106" text-anchor="middle" font-size="26" font-weight="700" fill="#0277bd">2018</text>
    <text x="480" y="176" text-anchor="middle" font-size="14" fill="#10202b" font-weight="600">Nabu Casa</text>
    <text x="480" y="196" text-anchor="middle" font-size="13.5" fill="#5a6f7e">founded to fund</text>
    <text x="480" y="214" text-anchor="middle" font-size="13.5" fill="#5a6f7e">full-time work</text>

    <!-- 2024 -->
    <circle cx="672" cy="132" r="8" fill="#03a9f4"/>
    <text x="672" y="106" text-anchor="middle" font-size="26" font-weight="700" fill="#0277bd">2024</text>
    <text x="672" y="176" text-anchor="middle" font-size="14" fill="#10202b" font-weight="600">Open Home Foundation</text>
    <text x="672" y="196" text-anchor="middle" font-size="13.5" fill="#5a6f7e">takes ownership of</text>
    <text x="672" y="214" text-anchor="middle" font-size="13.5" fill="#5a6f7e">code and brand</text>

    <!-- 2026 -->
    <circle cx="864" cy="132" r="8" fill="#03a9f4"/>
    <text x="864" y="106" text-anchor="middle" font-size="26" font-weight="700" fill="#0277bd">2026</text>
    <text x="864" y="176" text-anchor="middle" font-size="14" fill="#10202b" font-weight="600">1,500+ integrations</text>
    <text x="864" y="196" text-anchor="middle" font-size="13.5" fill="#5a6f7e">2.7M households</text>
    <text x="864" y="214" text-anchor="middle" font-size="13.5" fill="#5a6f7e">21,000+ contributors</text>
  </g>
</svg>
