name: Publish slides

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-html
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build deck
        run: npm run build

      - name: Prepare Pages root
        run: |
          # Pages serves index.html at the site root; keep slides.html as-is
          # so local builds and direct links stay stable.
          cp dist/slides.html dist/index.html
          # Skip Jekyll so every asset is served byte-for-byte.
          touch dist/.nojekyll

      - name: Publish to html branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: html
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
