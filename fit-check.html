<h1 id="every-entity-answers-three-questions">Every entity answers three questions</h1>
<p><span class="pill">What is it?</span><br />
<span class="pill">What is its state?</span><br />
<span class="pill">When did it change?</span></p>
<br />
<ol>
<li><strong>Identity</strong> — <code>entity_id</code>, written as <code>domain.object_id</code><br />
<code>light.kitchen_ceiling</code>, <code>binary_sensor.driveway_person</code></li>
<li><strong>State</strong> — one string, plus a bag of attributes<br />
<code>on</code>, <code>21.5</code>, <code>home</code>, <code>unavailable</code></li>
<li><strong>Time</strong> — <code>last_changed</code> and <code>last_updated</code></li>
</ol>
<div class="callout quiet">
<p>Everything else in Home Assistant — dashboards, automations, history, voice — is built on those three answers.</p>
</div>

    <span class="hljs-attr">&quot;brightness&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">178</span><span class="hljs-punctuation">,</span>
    <span class="hljs-attr">&quot;color_temp_kelvin&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">2700</span><span class="hljs-punctuation">,</span>

  <span class="hljs-attr">&quot;last_updated&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;2026-10-19T08:12:41.220Z&quot;</span><span class="hljs-punctuation">,</span>

<h1 id="state-is-not-always-a-boolean">State is not always a boolean</h1>
<ul>
<li><strong><code>on</code> / <code>off</code></strong> — the workhorses</li>
<li><strong>Numbers</strong> — <code>21.5</code>, <code>178</code>, <code>8.4</code></li>
<li><strong>Text</strong> — <code>home</code>, <code>not_home</code>, <code>heating</code>, <code>cooling</code></li>
<li><strong>Timestamps</strong> — <code>2026-10-19T08:12:41+00:00</code></li>
<li><strong><code>unknown</code></strong> — the entity exists, but has never reported</li>
<li><strong><code>unavailable</code></strong> — it is gone: network, battery, reload, dead device</li>
</ul>
<div class="callout warn">
<p><strong><code>unavailable</code> is not <code>off</code>.</strong> Treating them the same is how a dead sensor becomes a dark house — or an unlocked door.</p>
</div>
<footer>Home Assistant · a state engine for your house · ZL4EKA</footer>

<h1 id="what-can-you-know-about-your-house">What can you know about your house?</h1>
<table>
<thead>
<tr>
<th>Question</th>
<th>Entity</th>
<th>State</th>
</tr>
</thead>
<tbody>
<tr>
<td>Is the light on? How dim?</td>
<td><code>light.kitchen_ceiling</code></td>
<td><code>on</code>, <code>brightness: 178</code></td>
</tr>
<tr>
<td>Is the room occupied?</td>
<td><code>binary_sensor.kitchen_occupancy</code></td>
<td><code>on</code></td>
</tr>
<tr>
<td>Is anyone home?</td>
<td><code>person.jonah</code></td>
<td><code>home</code></td>
</tr>
<tr>
<td>What time of day is it?</td>
<td><code>sensor.time_of_day</code></td>
<td><code>evening</code></td>
</tr>
<tr>
<td>Where is the sun?</td>
<td><code>sun.sun</code></td>
<td><code>below_horizon</code>, <code>elevation: -12.4</code></td>
</tr>
<tr>
<td>Is it a public holiday?</td>
<td><code>binary_sensor.workday</code></td>
<td><code>off</code></td>
</tr>
<tr>
<td>Is a meeting happening now?</td>
<td><code>calendar.work</code></td>
<td><code>on</code></td>
</tr>
<tr>
<td>Is someone coming up the drive?</td>
<td><code>binary_sensor.driveway_person</code></td>
<td><code>on</code></td>
</tr>
<tr>
<td>Is the washer running?</td>
<td><code>sensor.washer_power</code></td>
<td><code>412 W</code></td>
</tr>
<tr>
<td>Is the dishwasher done?</td>
<td><code>binary_sensor.dishwasher_done</code></td>
<td><code>on</code></td>
</tr>
</tbody>
</table>
<div class="callout quiet">
<p>Ten questions, ten states, one vocabulary. Note how many of the right-hand answers are <strong>inferred</strong>, not measured.</p>
</div>
<footer>Home Assistant · a state engine for your house · ZL4EKA</footer>

<h1 id="occupancy">Occupancy</h1>
<p><strong>Occupancy is not a sensor. It is a &quot;derived state&quot;</strong></p>
<div class="columns">
<div>
<ul>
<li><strong>PIR motion</strong> — cheap, fast, blind to stillness</li>
<li><strong>mmWave</strong> — sees stillness, more false positives</li>
<li><strong>Phone Wi-Fi / GPS</strong> — great for &quot;home&quot;, lags on exit</li>
<li><strong>BLE beacons</strong> — room-level, battery-dependent</li>
<li><strong>Cameras</strong> — precise, privacy trade-off</li>
<li><strong>Doors, media, lights</strong> — inference, not measurement</li>
</ul>
</div>
<div>
<pre><code class="language-yaml"><span class="hljs-attr">template:</span>
  <span class="hljs-bullet">-</span> <span class="hljs-attr">binary_sensor:</span>
      <span class="hljs-bullet">-</span> <span class="hljs-attr">name:</span> <span class="hljs-string">&quot;Kitchen occupied&quot;</span>
        <span class="hljs-attr">state:</span> <span class="hljs-string">&gt;
          {{ is_state(&#x27;binary_sensor.kitchen_motion&#x27;, &#x27;on&#x27;)
             or is_state(&#x27;binary_sensor.kitchen_presence&#x27;, &#x27;on&#x27;)
             or is_state(&#x27;media_player.kitchen&#x27;, &#x27;playing&#x27;) }}
</span>        <span class="hljs-attr">delay_off:</span>
          <span class="hljs-attr">minutes:</span> <span class="hljs-number">5</span>
</code></pre>
</div>
</div>
<div class="callout">
<p>One sensor lies. Five sensors argue. Encode the argument once, in a template.</p>
</div>
<footer>Home Assistant · a state engine for your house · ZL4EKA</footer>
</section>

<h1 id="time-sun-calendars-holidays">Time, sun, calendars, holidays</h1>
<div class="columns">
<div>
<h3 id="the-sun">The sun</h3>
<p><code>sun.sun</code> is <code>above_horizon</code> or <code>below_horizon</code>, with attributes:</p>
<ul>
<li><code>elevation</code>, <code>azimuth</code></li>
<li><code>next_dawn</code>, <code>next_dusk</code></li>
<li><code>next_rising</code>, <code>next_setting</code></li>
</ul>
<p>Triggers can offset it: sunset at <strong>−00:45</strong>.</p>
<h3 id="time-of-day">Time of day</h3>
<ul>
<li><code>sensor.time</code> — <code>18:42</code></li>
<li>the <code>tod</code> helper → <code>binary_sensor.evening</code></li>
<li>a template sensor → <code>night</code>, <code>morning</code>, <code>afternoon</code></li>
</ul>
</div>
<div>
<h3 id="calendars">Calendars</h3>
<p><code>calendar.work</code> is <code>on</code> <strong>while an event is running</strong>.</p>
<p>Trigger on <code>start</code> / <code>end</code>, with an offset.</p>
<h3 id="holidays">Holidays</h3>
<p><code>workday</code> knows countries and provinces:</p>
<pre><code class="language-yaml"><span class="hljs-attr">binary_sensor:</span>
  <span class="hljs-bullet">-</span> <span class="hljs-attr">platform:</span> <span class="hljs-string">workday</span>
    <span class="hljs-attr">country:</span> <span class="hljs-string">NZ</span>
    <span class="hljs-attr">province:</span> <span class="hljs-string">WGN</span>
</code></pre>
<p>Now &quot;is it a workday?&quot; is just a state.</p>
</div>
</div>
<div class="callout quiet">
<p>Anything that can craft a valid &quot;state&quot; object can create a state. States are the building blocks of &quot;Automations&quot;</p>
</div>
<footer>Home Assistant · a state engine for your house · ZL4EKA</footer>

<pre><code class="language-yaml"><span class="hljs-attr">triggers:</span>

<h1 id="deployment-1-a-vm-in-your-cluster">Deployment 1: a VM in your cluster</h1>
<p><strong>HAOS image on Proxmox, KVM, or ESXi.</strong></p>
<ul>
<li>Snapshots before every upgrade</li>
<li>Backups to NAS, off the host</li>
<li>2 vCPU, 4 GB RAM, 32 GB disk covers most homes</li>
<li>You still get Supervisor, add-ons, and HAOS updates</li>
<li>You get the ability to run &quot;add-ons&quot; which are Docker containers that can add other functionality</li>
</ul>
<div class="callout warn">
<p><strong>Zigbee Radios</strong> USB passthrough for Zigbee/Z-Wave, or dedicated device.<br />
Use a USB extension cable, a powered hub, or a network coordinator<br />
(SLZB-06, Zigbee2MQTT, ser2net).</p>
</div>
<div class="columns">
<div>
<p><strong>Pros</strong> — snapshots, consolidation, remote host access, easy restore.</p>
</div>
<div>
<p><strong>Cons</strong> — passthrough pain, host maintenance is house downtime.</p>
</div>
</div>
<footer>Home Assistant · a state engine for your house · ZL4EKA</footer>
</section>

<h1 id="deployment-2-dedicated-hardware">Deployment 2: dedicated hardware</h1>
<p><strong>An appliance for the house.</strong></p>
<ul>
<li><strong>Home Assistant Green</strong>, or your own Pi / mini PC</li>
<li>Raspberry Pi 4 or 5 — <strong>boot from SSD, never an SD card</strong></li>
<li>Any x86 mini PC; ARM and x86 both work</li>
<li>HAOS gives you Supervisor, add-ons, and managed updates</li>
<li>UPS on the HA box and the network gear</li>
</ul>
<div class="callout">
<p>Keep the radio stick on a USB extension cable, away from USB 3 ports and the Pi itself. It is the cheapest reliability upgrade you can buy.</p>
</div>
<div class="columns">
<div>
<p><strong>Pros</strong> — isolated, predictable, radios are physically local, no hypervisor.</p>
</div>
<div>
<p><strong>Cons</strong> — another box and power brick; backups are your job.</p>
</div>
</div>
<footer>Home Assistant · a state engine for your house · ZL4EKA</footer>

<h1 id="deployment-3-a-container">Deployment 3: a container</h1>
<pre><code class="language-yaml"><span class="hljs-attr">services:</span>
  <span class="hljs-attr">homeassistant:</span>
    <span class="hljs-attr">image:</span> <span class="hljs-string">ghcr.io/home-assistant/home-assistant:stable</span>
    <span class="hljs-attr">network_mode:</span> <span class="hljs-string">host</span>
    <span class="hljs-attr">volumes:</span>
      <span class="hljs-bullet">-</span> <span class="hljs-string">./config:/config</span>
    <span class="hljs-attr">restart:</span> <span class="hljs-string">unless-stopped</span>
</code></pre>
<div class="columns">
<div>
<ul>
<li>You get <strong>Core only</strong></li>
<li>No Supervisor → <strong>no add-ons</strong></li>
<li>No HAOS backups or one-click updates</li>
<li>You own Python deps, reverse proxy, updates</li>
</ul>
</div>
<div>
<ul>
<li>Fine for Kubernetes or &quot;everything in one orchestrator&quot;</li>
<li>USB devices need explicit mapping</li>
<li>Not the path of least resistance</li>
</ul>
</div>
</div>
<div class="callout warn">
<p>I would not recommend it for a normal home. The appliance <em>is</em> the product — the container strips the parts that make it one.</p>
</div>
<footer>Home Assistant · a state engine for your house · ZL4EKA</footer>

<h1 id="under-the-hood-1">Under the hood</h1>
<div class="columns">
<div>
<ul>
<li><strong>Python 3 + asyncio</strong> — one event loop</li>
<li><strong>Event bus</strong> — every state change is an event</li>
<li><strong>State machine</strong> — in-memory, rebuilt at startup</li>
<li><strong>Integrations</strong> — one async library per ecosystem</li>
</ul>
</div>
<div>
<ul>
<li><strong>Services</strong> — registered actions with validated schemas</li>
<li><strong>Recorder</strong> — SQLAlchemy into SQLite (or Postgres)</li>
<li><strong>Frontend</strong> — web app over a WebSocket API</li>
<li><strong>Automation engine</strong> — triggers subscribe to the bus</li>
</ul>
</div>

<h1 id="sqlite-is-amazing">SQLite is amazing</h1>
<div class="columns">
<div>
<ul>
<li><strong>Public domain</strong>, one file, zero configuration</li>
<li>The most widely deployed database engine on earth — phones, browsers, cars, aircraft</li>
<li><strong>ACID</strong>, with WAL: readers never block the writer</li>
<li>The file format is portable across platforms and versions</li>
<li><strong>Backup is a file copy</strong> — or one command</li>
<li>No server, no port, no auth surface to expose</li>
<li>281 TB theoretical limit; you will not reach it</li>
<li>25+ years of adversarial testing</li>
</ul>
</div>
<div>
<pre><code class="language-bash"><span class="hljs-comment"># consistent backup while it runs</span>
sqlite3 home-assistant_v2.db \
  <span class="hljs-string">&quot;.backup &#x27;/backup/ha.db&#x27;&quot;</span>

<span class="hljs-comment"># or a compacted copy</span>
sqlite3 home-assistant_v2.db \
  <span class="hljs-string">&quot;VACUUM INTO &#x27;/backup/ha.db&#x27;&quot;</span>

<span class="hljs-comment"># is it healthy?</span>
sqlite3 home-assistant_v2.db \
  <span class="hljs-string">&quot;PRAGMA integrity_check;&quot;</span>
</code></pre>
<div class="callout quiet">
<p>The boring choice that outlives your hardware. That is a compliment.</p>
</div>
</div>
</div>
<footer>Home Assistant · a state engine for your house · ZL4EKA</footer>
</section>

<h1 id="sqlite-inside-home-assistant">SQLite inside Home Assistant</h1>
<div class="columns">
<div>
<ul>
<li>Database: <code>config/home-assistant_v2.db</code></li>
<li>Written by <code>recorder</code> in <strong>batches</strong>, not per event</li>
<li><code>purge_keep_days</code> trims raw history (default 10 days)</li>
<li><strong>Long-term statistics</strong> keep hourly aggregates forever</li>
<li><code>recorder:</code> include/exclude keeps the file small</li>
<li>Default because it is genuinely enough for most homes</li>
</ul>
</div>
<div>
<pre><code class="language-yaml"><span class="hljs-attr">recorder:</span>
  <span class="hljs-attr">purge_keep_days:</span> <span class="hljs-number">14</span>
  <span class="hljs-attr">commit_interval:</span> <span class="hljs-number">5</span>
  <span class="hljs-attr">exclude:</span>
    <span class="hljs-attr">domains:</span>
      <span class="hljs-bullet">-</span> <span class="hljs-string">media_player</span>
    <span class="hljs-attr">entity_globs:</span>
      <span class="hljs-bullet">-</span> <span class="hljs-string">sensor.*_signal_strength</span>
</code></pre>
</div>
</div>
<div class="callout">
<p>A home is a low-write workload with occasional bursts. This is exactly the shape SQLite handles well.</p>
</div>
<footer>Home Assistant · a state engine for your house · ZL4EKA</footer>

<h1 id="you-can-interrogate-the-database-directly">You can interrogate the database directly</h1>
<pre><code class="language-bash">sqlite3 -<span class="hljs-built_in">readonly</span> config/home-assistant_v2.db
</code></pre>
<pre><code class="language-sql"><span class="hljs-keyword">SELECT</span> sm.entity_id, s.state, s.last_updated_ts
<span class="hljs-keyword">FROM</span> states s
<span class="hljs-keyword">JOIN</span> states_meta sm <span class="hljs-keyword">ON</span> sm.metadata_id <span class="hljs-operator">=</span> s.metadata_id
<span class="hljs-keyword">WHERE</span> sm.entity_id <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;sensor.washer_power&#x27;</span>
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> s.last_updated_ts <span class="hljs-keyword">DESC</span>
LIMIT <span class="hljs-number">10</span>;
</code></pre>
<div class="columns">
<div>
<ul>
<li><code>states</code> + <code>states_meta</code> — the raw event log</li>
<li><code>statistics</code> — long-term aggregates</li>
<li><code>events</code> — non-state events</li>
<li>Timestamps are Unix epoch floats</li>
</ul>
</div>
<div>
<ul>
<li>Open <strong>read-only</strong> while HA is running</li>
<li><code>EXPLAIN QUERY PLAN</code> before you blame the disk</li>
<li>The file is portable: copy it anywhere and query it</li>
<li>Never put it on NFS or SMB</li>
</ul>
</div>
</div>
<div class="callout warn">
<p>A live <code>cp</code> can capture a torn write. Use <code>.backup</code> or <code>VACUUM INTO</code>.</p>
</div>
<footer>Home Assistant · a state engine for your house · ZL4EKA</footer>

<h1 id="when-sqlite-is-not-enough">When SQLite is not enough</h1>
<p>Home Assistant does support Postgres</p>
<div class="columns">
<div>
<p><strong>Stay on SQLite if…</strong></p>
<ul>
<li>one Home Assistant instance</li>
<li>tens of thousands of state changes per day</li>
<li>history measured in weeks</li>
<li>you value a single portable file</li>
</ul>
</div>
<div>
<p><strong>Move to Postgres if…</strong></p>
<ul>
<li>very large installs with high event rates</li>
<li>multiple writers or shared reporting</li>
<li>long raw retention, external BI tools</li>
<li>you already operate Postgres well</li>
</ul>
</div>
</div>
<pre><code class="language-yaml"><span class="hljs-attr">recorder:</span>
  <span class="hljs-attr">db_url:</span> <span class="hljs-string">postgresql://user:pass@host/homeassistant</span>
</code></pre>
<div class="callout quiet">
<p>Move for a measured reason, not for fashion. In most homes SQLite is not the bottleneck — the radio is.</p>
</div>
<footer>Home Assistant · a state engine for your house · ZL4EKA</footer>
